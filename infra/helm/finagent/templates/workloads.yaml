apiVersion: v1
kind: ConfigMap
metadata:
  name: finagent-config
  labels: {{- include "finagent.labels" . | nindent 4 }}
data:
  FINAGENT_ENVIRONMENT: {{ .Values.environment | quote }}
{{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: {{ .Values.secretProviderClass.name }}}
spec:
  provider: azure
  secretObjects:
    - secretName: finagent-secrets
      type: Opaque
      data:
{{- range $env, $kv := .Values.secretProviderClass.secrets }}
        - {objectName: {{ $kv }}, key: {{ $env }}}
{{- end }}
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.workloadIdentity.clientIdApi | quote }}
    keyvaultName: {{ .Values.secretProviderClass.keyVaultName | quote }}
    tenantId: {{ .Values.secretProviderClass.tenantId | quote }}
    objects: |
      array:
{{- range $env, $kv := .Values.secretProviderClass.secrets }}
        - |
          objectName: {{ $kv }}
          objectType: secret
{{- end }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.migration.secretProviderClassName | quote }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.workloadIdentity.clientIdMigrator | quote }}
    keyvaultName: {{ .Values.secretProviderClass.keyVaultName | quote }}
    tenantId: {{ .Values.secretProviderClass.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.migration.databaseUrlSecretName | quote }}
          objectAlias: migration-database-url
          objectType: secret
---
apiVersion: batch/v1
kind: Job
metadata:
  name: finagent-migrate
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-delete-policy": "before-hook-creation"
spec:
  backoffLimit: 0
  template:
    metadata: {labels: {app: finagent-migrate, azure.workload.identity/use: "true"}}
    spec:
      restartPolicy: Never
      serviceAccountName: finagent-migrator   # schema owner identity (ADR-0014); app pods never run DDL
      containers:
        - name: migrate
          image: "{{ .Values.image.registry }}/finagent-api:{{ .Values.image.tag }}"
          command: ["/bin/sh", "-ec"]
          args:
            - 'FINAGENT_MIGRATION_DATABASE_URL="$(cat /mnt/migration/migration-database-url)"; test -n "$FINAGENT_MIGRATION_DATABASE_URL"; export FINAGENT_MIGRATION_DATABASE_URL; exec python -m alembic upgrade head'
          {{- include "finagent.securityContext" . | nindent 10 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: migration-secret, mountPath: /mnt/migration, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {}}
        - name: migration-secret
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: {secretProviderClass: {{ .Values.migration.secretProviderClassName | quote }}}
{{- range $name, $spec := dict "api" .Values.api "worker" .Values.worker "web" .Values.web }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: finagent-{{ $name }}, labels: {app: finagent-{{ $name }}}}
spec:
  replicas: {{ $spec.replicas }}
  selector: {matchLabels: {app: finagent-{{ $name }}}}
  template:
    metadata: {labels: {app: finagent-{{ $name }}, azure.workload.identity/use: "true"}}
    spec:
      serviceAccountName: finagent-{{ $name }}
      automountServiceAccountToken: {{ if eq $name "web" }}false{{ else }}true{{ end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/finagent-{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- include "finagent.env" $ | nindent 10 }}
          {{- include "finagent.securityContext" $ | nindent 10 }}
          resources: {{- toYaml $spec.resources | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: kv, mountPath: /mnt/kv, readOnly: true}]
          {{- if eq $name "api" }}
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}, periodSeconds: 20}
          {{- else if eq $name "web" }}
          ports: [{containerPort: 3000}]
          readinessProbe: {httpGet: {path: /signin, port: 3000}, periodSeconds: 10}
          {{- end }}
      volumes:
        - {name: tmp, emptyDir: {}}
        - name: kv
          csi: {driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: {secretProviderClass: {{ $.Values.secretProviderClass.name }}}}
{{- end }}
---
apiVersion: v1
kind: Service
metadata: {name: finagent-api}
spec: {selector: {app: finagent-api}, ports: [{port: 80, targetPort: 8000}]}
---
apiVersion: v1
kind: Service
metadata: {name: finagent-web}
spec: {selector: {app: finagent-web}, ports: [{port: 80, targetPort: 3000}]}
---
# Default deny; only web -> api, ingress -> web, and egress the platform needs (DNS + Azure PaaS via
# private endpoints). Agents/tools have no arbitrary egress (prompt §12, §26).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: finagent-default-deny}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: finagent-allow}
spec:
  podSelector: {matchLabels: {app: finagent-api}}
  policyTypes: [Ingress]
  ingress: [{from: [{podSelector: {matchLabels: {app: finagent-web}}}], ports: [{port: 8000}]}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: finagent-worker}
spec: {minAvailable: 1, selector: {matchLabels: {app: finagent-worker}}}
