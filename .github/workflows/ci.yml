# CI workflow (ADR-0009). GitHub-hosted results are recorded per revision in the evidence register.
# Image signing, SBOM attestation, Terraform plan and environment promotion need registry/cloud
# credentials and are documented in docs/operations/deployment.md - not faked here.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  infrastructure:
    name: Infrastructure reference validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with: {version: "v3.17.3"}
      - name: Validate Terraform reference without a backend
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive -no-color
          terraform init -backend=false -lockfile=readonly -input=false -no-color
          terraform validate -no-color
          terraform test -no-color
      - name: Lint and inspect Helm renders with synthetic values
        run: |
          python -m pip install -c requirements.lock PyYAML
          helm lint infra/helm/finagent
          python infra/helm/verify_render.py --helm helm

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: python scripts/tasks.py lint typecheck
      - run: python -m pytest tests/unit
      - name: OpenAPI and event-contract drift
        run: |
          python scripts/export_openapi.py > /tmp/openapi.json
          diff -u docs/api/openapi.json /tmp/openapi.json
          python scripts/export_event_schemas.py
          git diff --exit-code packages/contracts/events

  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: python scripts/tasks.py security
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}

  integration:
    runs-on: ubuntu-24.04
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: finagent, POSTGRES_PASSWORD: finagent, POSTGRES_DB: finagent_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finagent" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      FINAGENT_TEST_DATABASE_URL: postgresql+psycopg://finagent:finagent@127.0.0.1:5432/finagent_test
      FINAGENT_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Release-blocker suite (prompt section 31) - must be 100% green
        run: python -m pytest -m release_blocker
      - name: Full suite (incl. E2E acceptance journey) with evidence + traceability
        run: python scripts/tasks.py test
      - name: Fail if any test was skipped (would be NOT RUN, never PASSED)
        run: "! grep -q '<skipped' reports/junit.xml"
      - name: Security-control mutation check (every control must be caught)
        run: python scripts/tasks.py mutation-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            reports/junit.xml
            docs/traceability/

  browser-acceptance:
    name: Synthetic browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: finagent, POSTGRES_PASSWORD: finagent, POSTGRES_DB: finagent_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finagent" --health-interval 5s --health-retries 10
    env:
      FINAGENT_TEST_DATABASE_URL: postgresql+psycopg://finagent:finagent@127.0.0.1:5432/finagent_test
      NEXT_TELEMETRY_DISABLED: "1"
      FINAGENT_WEB_SESSION_SECRET: "ci-build-only-placeholder-not-a-secret-000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - name: Install synthetic test dependencies
        run: |
          pip install -e ".[dev]" playwright==1.64.0
          python -m playwright install --with-deps chromium
      - name: Build web application
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Run synthetic browser journeys
        run: |
          mkdir -p reports
          python -m pytest -m browser \
            tests/browser/test_ui_journey.py \
            tests/browser/test_case_checklist_keyboard.py \
            tests/browser/test_policy_admin_table_keyboard.py \
            tests/browser/test_workspace_mobile_navigation.py \
            tests/browser/test_workspace_table_keyboard.py \
            tests/browser/test_uncertain_action_browser.py \
            --junitxml=reports/junit-browser.xml -q --tb=short
      - name: Verify browser evidence is complete and passing
        run: python scripts/verify_browser_report.py reports/junit-browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: reports/junit-browser.xml
          if-no-files-found: warn

  web:
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - name: UI rendering and behavior tests
        run: npm run test:ui
      - name: Authentication tests
        run: npm run test:auth
      - name: Passkey proxy tests
        run: npm run test:passkeys
      - run: npm run build
        env: {NEXT_TELEMETRY_DISABLED: "1", FINAGENT_WEB_SESSION_SECRET: "ci-build-only-placeholder-not-a-secret-000"}

  images:
    runs-on: ubuntu-24.04
    needs: [integration, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build images (no push, no signing without registry credentials)
        run: |
          docker build -f apps/api/Dockerfile -t finagent-api:ci .
          docker build -f apps/worker/Dockerfile -t finagent-worker:ci .
          docker build -f apps/web/Dockerfile -t finagent-web:ci .
