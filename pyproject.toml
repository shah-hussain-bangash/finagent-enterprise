[project]
name = "finagent"
version = "0.1.0"
description = "FinAgent Enterprise - Human-Reviewed AML Investigation Copilot (Release 1)"
requires-python = ">=3.12"
dependencies = [
  "webauthn==3.0.1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "redis>=5.2,<7",
  "cryptography>=45,<52",
  "langgraph>=1.2.14,<1.3",
  "pypdf>=6.21.4,<7",
  "certifi>=2026.10.19",
  "defusedxml>=0.7,<0.8",
]

[project.optional-dependencies]
# Azure adapters import these lazily; local/test never needs them at runtime (prompt Â§2).
azure = ["azure-servicebus>=7.14,<8", "azure-identity>=1.19,<2", "azure-storage-blob>=12.20,<13"]
dev = [
  "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "pip-audit>=2.7", "pyyaml>=6",
  "types-PyYAML>=6", "types-defusedxml>=0.7", "finagent[azure]",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finagent = [
  "database/migrations/*.ini", "database/migrations/*.mako",
  "evaluation/*.json", "evaluation/datasets/*.json",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S101"]  # assert allowed in tests via per-file below

[tool.ruff.lint.isort]
known-first-party = ["finagent", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S105", "S106"]
"src/finagent/database/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["finagent", "mockbank"]
mypy_path = "src:apps/mock-bank"

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "apps/mock-bank"]
markers = [
  "req(*ids): requirement IDs verified by this test (see ADR-0011/0012)",
  "integration: needs PostgreSQL (FINAGENT_TEST_DATABASE_URL)",
  "release_blocker: failure blocks any release (prompt Â§31)",
  "browser: real-browser UI journey (needs web build + chromium); run via tasks.py test-browser",
]
addopts = "-ra --strict-markers -m 'not browser'"
junit_family = "legacy"  # record_property requires it (ADR-0012)

